[workspace]
resolver = "2"
members = ["crates/os-model", "crates/os-flp", "crates/os-engine", "crates/os-dsp", "tools/flp-dump", "tools/os-render", "tools/os-play", "tools/bundle-app", "crates/os-native", "tools/os-native-probe", "crates/os-theme", "crates/os-ui", "crates/os-app", "plugins/lemon-sampler", "tools/bundle-plugins", "crates/os-clap", "crates/os-hostlink", "crates/os-plugkit", "plugins/lemon-parametric-eq-2", "crates/os-host", "crates/os-vst3", "crates/os-vst2", "plugins/lemon-3x-osc", "plugins/lemon-limiter", "plugins/lemon-reverb", "plugins/lemon-delay", "plugins/lemon-small-fx", "plugins/lemon-soft-clipper", "plugins/lemon-fast-distortion", "plugins/lemon-balance", "plugins/lemon-stereo-enhancer", "plugins/lemon-transient-processor", "plugins/lemon-chorus", "plugins/lemon-stereo-shaper", "plugins/lemon-filter", "plugins/citrus", "plugins/smith", "plugins/tesla", "plugins/pulp-filter", "plugins/press", "crates/os-paths", "tools/watermark", "crates/os-smf", "tools/notices", "tools/updater", "plugins/lemon-flanger", "plugins/lemon-phaser", "plugins/lemon-peak-controller", "plugins/lemon-formula-controller", "plugins/lemon-slicer", "plugins/lemon-vocoder", "plugins/lemon-drum-sampler", "plugins/lemon-drop", "plugins/lemon-tune", "crates/os-web"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
os-model = { path = "crates/os-model" }
os-flp = { path = "crates/os-flp" }
os-engine = { path = "crates/os-engine" }
os-dsp = { path = "crates/os-dsp" }
os-hostlink = { path = "crates/os-hostlink" }
os-host = { path = "crates/os-host" }
os-vst3 = { path = "crates/os-vst3" }
os-vst2 = { path = "crates/os-vst2" }
os-paths = { path = "crates/os-paths" }
os-smf = { path = "crates/os-smf" }
os-web = { path = "crates/os-web" }
thiserror = "2"

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Lemon Studio web build (`web/`): nih-plug with a single-threaded event loop for wasm32. Native builds are unchanged by
# the patch (the changes are behind `cfg(target_arch = "wasm32")`).
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "web/vendor/nih-plug" }

# Lemon Studio web build: libloading with a `Library` that never opens on wasm32 (no native plugins on the web).
[patch.crates-io]
libloading = { path = "web/vendor/libloading" }
# web-time's `Instant` with headroom below `now()` on the web (see the vendored file).
web-time = { path = "web/vendor/web-time" }

# The web build (`web/build.sh`): optimised, no debug info, one codegen unit for a smaller wasm file.
[profile.web]
inherits = "release"
debug = false
strip = "debuginfo"
