[package]
name = "os-engine"
description = "Lemon Studio audio engine: sample loading, mixing and rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
# Threads and files of the web build (std on native).
os-web.workspace = true
# `Instant` and `SystemTime` that also work in the web build (std on native).
web-time = "1"
os-model.workspace = true
os-dsp.workspace = true
miniz_oxide = "0.8"
thiserror.workspace = true
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "ogg", "vorbis", "mp3", "aiff", "isomp4", "aac", "alac", "id3v1", "id3v2"] }
symphonia-codec-wavpack = "0.1"
