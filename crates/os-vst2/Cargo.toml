[package]
name = "os-vst2"
description = "Lemon Studio's VST 2 plugin host (clean-room interface, no Steinberg SDK)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
# `Instant` and `SystemTime` that also work in the web build (std on native).
web-time = "1"
libloading = "0.8"
os-engine.workspace = true
os-host.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
