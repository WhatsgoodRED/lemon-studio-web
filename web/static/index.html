<script>
  /* Day (default) or night, before the first paint: MetroBar's own switch (metrobar.bookDay, shared with the Highlight
     Zone; true or missing = day). */
  try { if (JSON.parse(localStorage.getItem('metrobar.bookDay') || 'true') === false) document.documentElement.classList.add('night'); } catch (e) {}

<style>
  /* Day: metrobarz.com's light palette (landing-beat-meter.html, :root[data-theme="light"]), the MetroBar theme.
     Night: the first, dark MetroBar palette, the MetroBar Night theme. */
  :root { --accent: #af0000; --on-accent: #fff; --bg: #eef0ec; --panel: #e2e5df; --fg: #15181a; --muted: #5d6662; --line: #c5cbc4; --cell: #d3d8d1; --face: #f8f9f7; --veil: rgba(238,240,236,.75); color-scheme: light; }
  :root.night { --bg: #111413; --panel: #1a1e1d; --fg: #e9ece8; --muted: #8e9893; --line: #2c3331; --cell: #252b29; --face: #252b29; --veil: rgba(17,20,19,.75); color-scheme: dark; }
  svg .ink { fill: var(--fg); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
  /* The canvas fills the page above the bar; on a smaller screen the app draws its 1024 x 600 layout smaller until it
     fits (`ui_scale` in os-app). --bar: the bottom bar's height, taller for fingers. */
  :root { --bar: 24px; }
  @media (pointer: coarse) { :root { --bar: 34px; } }
  #lemon-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: calc(100vh - var(--bar)); height: calc(100dvh - var(--bar)); display: block; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 3px; background: var(--panel); border-top: 1px solid var(--line); }
  #bar a, #bar button:not(.smt) { white-space: nowrap; flex: none; color: var(--fg); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
  #bar a:hover, #bar button:not(.smt):hover { color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  /* The way back to the MetroBar app: outlined red, as the app's secondary button (.beatbtn) */
  #bar a#back { display: inline-flex; align-items: center; height: 18px; padding: 0 8px; border: 1.5px solid var(--accent); border-radius: 5px; background: var(--face); color: var(--fg); font-weight: 600; white-space: nowrap; }
  #bar a#back:hover, #bar a#back:focus-visible { background: var(--accent); color: var(--on-accent); text-decoration: none; outline: none; }
  #bar .sp { flex: 1; }
  #bar .credit, #bar .credit a { color: var(--muted); }
  #bar .credit { min-width: 0; flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .mark { display: flex; align-items: center; height: 11px; margin-right: 2px; }
  #bar .mark svg { height: 11px; width: auto; display: block; }
  #status { min-width: 0; flex: 0 1 auto; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #start { position: fixed; inset: 0 0 var(--bar) 0; display: none; align-items: center; justify-content: center; background: var(--veil); z-index: 5; }
  #start button { font: 600 18px "IBM Plex Sans", system-ui, sans-serif; padding: 14px 26px; border-radius: 6px; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  #drop { position: fixed; inset: 0 0 var(--bar) 0; display: none; align-items: center; justify-content: center; border: 3px dashed var(--accent); background: var(--veil); color: var(--fg); font-size: 20px; z-index: 6; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; background: var(--bg); color: var(--muted); font-size: 14px; z-index: 4; }
  #loading .wm svg { width: min(460px, 80vw); height: auto; display: block; }
  #loading .t { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 12rem; }
  #loading .t i { height: 6px; border-radius: 3px; background: var(--cell); animation: beat 2s steps(1) infinite; }
  #loading .t i:nth-child(2) { animation-delay: .5s; } #loading .t i:nth-child(3) { animation-delay: 1s; } #loading .t i:nth-child(4) { animation-delay: 1.5s; }
  /* Phones and tablets: the bar scrolls sideways instead of squeezing; a phone held upright is asked to turn. */
  #bar { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; overscroll-behavior: contain; }
  #bar::-webkit-scrollbar { display: none; }
  #bar > * { flex: none; } #bar > .sp { flex: 1 0 8px; } #bar .credit { white-space: nowrap; }
  @media (max-width: 1100px) { #bar #status { flex: none; max-width: 45vw; } }
  @media (pointer: coarse) { #bar { gap: 16px; padding: 0 12px 0 6px; } #bar a#back { height: 26px; } }
  #turn { display: none; position: fixed; inset: 0; z-index: 8; flex-direction: column; gap: 14px; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--bg); color: var(--fg); font-size: 16px; }
  #turn svg { width: 72px; height: 72px; }
  #turn button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 8px; }
  @media (orientation: portrait) and (max-width: 600px) { html:not(.upright) #turn { display: flex; } }
  @keyframes beat { 0% { background: var(--accent); } 25%, 100% { background: var(--cell); } }
  @media (prefers-reduced-motion: reduce) { #loading .t i { animation: none; } #loading .t i:last-child { background: var(--accent); } }
  /* Day / night switch: MetroBar's own (landing-beat-meter.html, the Highlight Zone's #bsDay, ".smt"), copied as it is. */
  /* Sun/moon switch (Bennie 2026-11-14; vanilla port of components/ui/sun-moon-theme-toggle.tsx): day sky with a sun and clouds, night sky with a moon and stars.
     Fixed sky colours on purpose (same in day and night theme); --smt-d is the one speed, the Settings cog turns on the same curve. */
  .smt { --smt-d: .5s; --smt-e: cubic-bezier(.34, 1.4, .5, 1); position: relative; flex: none; width: 40px; height: 22px; margin: 0 1px; padding: 0; border: 0; border-radius: 99px; overflow: hidden; cursor: pointer; background: linear-gradient(180deg, #3f8fe0, #a5d4f6); box-shadow: inset 0 1px 3px #0006, 0 0 0 1px #0002; -webkit-tap-highlight-color: transparent; }
  .smt::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #070b1f, #2a3364); opacity: 0; transition: opacity var(--smt-d) ease; }
  .smt i { position: absolute; display: block; }
  .smt-k { top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #ffd034; box-shadow: 0 0 9px 1px #ffd034b0, inset -2px -2px 3px #e89a00a0; transition: translate var(--smt-d) var(--smt-e), scale .2s ease-out, background-color var(--smt-d) ease, box-shadow var(--smt-d) ease; }
  .smt-k::before, .smt-k::after { content: ""; position: absolute; border-radius: 50%; background: #9aa3b5; opacity: 0; transition: opacity var(--smt-d) ease; }
  .smt-k::before { width: 5px; height: 5px; left: 3px; top: 4px; } .smt-k::after { width: 3px; height: 3px; left: 9px; top: 9px; }
  .smt-cl { right: 3px; bottom: -5px; width: 11px; height: 10px; border-radius: 50%; background: #fff; box-shadow: -7px 3px 0 1px #fff, 5px 4px 0 0 #fff; transition: translate var(--smt-d) ease, opacity var(--smt-d) ease; }
  .smt-st { left: 7px; top: 6px; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 6px 5px 0 0 #fff, 11px -2px 0 -.3px #fff, 3px 10px 0 -.3px #fff; opacity: 0; translate: 0 -8px; transition: translate var(--smt-d) ease, opacity var(--smt-d) ease; }
  .smt[aria-checked="true"]::before { opacity: 1; }
  .smt[aria-checked="true"] .smt-k { translate: 18px 0; background: #e3e7ee; box-shadow: 0 0 8px 0 #c9d4ff80, inset -2px -2px 3px #8d96a8a0; }
  .smt[aria-checked="true"] .smt-k::before, .smt[aria-checked="true"] .smt-k::after { opacity: 1; }
  .smt[aria-checked="true"] .smt-cl { translate: 0 14px; opacity: 0; } .smt[aria-checked="true"] .smt-st { translate: 0 0; opacity: 1; }
  .smt:hover .smt-k { scale: 1.1; } .smt:active .smt-k { scale: 1.25 .9; }
  .smt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Day/night switch in MetroBar's colours (landing-beat-meter.html, same block; Bennie 2026-11-14: "a red sun, grey skies,
     and when you switch it should look like a solar eclipse for night mode"). Day = grey cloudy sky + red sun. Night = the
     moon (.smt-k::before) slides over the sun; what's left is the red corona ring (the sun's box-shadow) and a white
     "diamond ring" bead (::after). :is(.smt, #b-night) so it beats the crater rules above. Moon and bead are sized in %,
     so they fit this 40x22 switch. */
  .smt { background: linear-gradient(180deg, #8f9893 0%, #bcc3be 55%, #d3d8d1 100%); box-shadow: inset 0 1px 3px #0005, 0 0 0 1px #0002; }
  .smt::before { background: radial-gradient(120% 140% at 70% 0%, #1d2321 0%, #0b0d0d 70%); }
  .smt-cl { background: #e9ece8; box-shadow: -7px 3px 0 1px #dfe3de, 5px 4px 0 0 #f4f5f3; }
  .smt-st { background: #c9cfcb; }
  :is(.smt, #b-night) .smt-k { background: radial-gradient(circle at 36% 34%, #e2392e 0%, #af0000 58%, #7a0000 100%); box-shadow: 0 0 8px 1px rgb(175 0 0 / .55), inset -1px -2px 3px rgb(80 0 0 / .45);
    transition: translate var(--smt-d) var(--smt-e), scale .2s ease-out, box-shadow var(--smt-d) ease; }
  :is(.smt, #b-night) .smt-k::before { left: 0; top: 0; width: 100%; height: 100%; background: radial-gradient(circle at 40% 38%, #232826, #0c0e0e 70%); opacity: 0; translate: -140% 0; transition: translate var(--smt-d) cubic-bezier(.3, .7, .2, 1), opacity calc(var(--smt-d) * .5) ease; }
  :is(.smt, #b-night) .smt-k::after { left: auto; right: -12%; top: -10%; width: 34%; height: 34%; background: #fff; opacity: 0; scale: .2; box-shadow: 0 0 3px 1px #fff, 0 0 7px 2px #ff6a5c; transition: opacity .25s ease, scale .35s var(--smt-e); }
  :is(.smt, #b-night)[aria-checked="true"] .smt-k { background: radial-gradient(circle at 36% 34%, #e2392e 0%, #af0000 58%, #7a0000 100%);
    box-shadow: 0 0 0 1.5px #ff4a3d, 0 0 6px 2px rgb(255 74 61 / .85), 0 0 14px 5px rgb(175 0 0 / .55); }
  :is(.smt, #b-night)[aria-checked="true"] .smt-k::before { opacity: 1; translate: 0 0; }
  :is(.smt, #b-night)[aria-checked="true"] .smt-k::after { opacity: 1; scale: 1; transition-delay: calc(var(--smt-d) * .8); }
  :root.night .smt { box-shadow: inset 0 1px 3px #0008, 0 0 0 1px #ffffff1a; }
  @media (prefers-reduced-motion: reduce) { .smt, .smt *, .smt *::before, .smt *::after, .smt::before { transition-duration: .01s !important; } }
</style>
